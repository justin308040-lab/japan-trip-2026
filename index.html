<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🇯🇵 名古屋・高山・立山 9日行程</title>
<style>
/* ── CSS Variables / Theme ───────────────────────────────────────────── */
:root {
  --bg: #0d1117;
  --bg2: #161b22;
  --bg3: #1e2a3a;
  --border: rgba(255,255,255,.09);
  --text: #e6edf3;
  --text2: #8b949e;
  --gold: #ffd93d;
  --red: #e74c3c;
  --blue: #4d96ff;
  --green: #6bcb77;
  --card-shadow: 0 4px 24px rgba(0,0,0,.4);
}
[data-theme="light"] {
  --bg: #f0f2f5;
  --bg2: #ffffff;
  --bg3: #f7f9fc;
  --border: rgba(0,0,0,.1);
  --text: #1a1a2e;
  --text2: #555;
  --card-shadow: 0 4px 24px rgba(0,0,0,.1);
}

/* ── Reset ───────────────────────────────────────────────────────────── */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Segoe UI', 'Noto Sans TC', sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden;
  transition: background .3s, color .3s;
}

/* ── Progress bar ────────────────────────────────────────────────────── */
#progress-bar {
  position: fixed; top:0; left:0; height:3px; z-index:9999;
  background: linear-gradient(90deg,#ff6b6b,#ffd93d,#6bcb77,#4d96ff);
  transition: width .1s; pointer-events:none;
}

/* ════════════════════════════════════════════════════════
   HERO – Japanese Scene
═══════════════════════════════════════════════════════ */
.hero {
  position: relative;
  height: 100vh; min-height: 560px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center; overflow: hidden;
}

/* layered background */
.hero-bg {
  position: absolute; inset: 0;
  background: linear-gradient(175deg,
    #04060f 0%,
    #0a0c1e 30%,
    #100818 60%,
    #08101a 100%);
}

/* seigaiha (青海波) wave pattern */
.hero-bg::after {
  content: '';
  position: absolute; inset: 0;
  background-image:
    radial-gradient(ellipse 36px 42px at 36px 0, transparent 30px, rgba(150,130,255,.055) 30px, rgba(150,130,255,.055) 34px, transparent 34px),
    radial-gradient(ellipse 36px 42px at 0px 0,   transparent 30px, rgba(150,130,255,.055) 30px, rgba(150,130,255,.055) 34px, transparent 34px),
    radial-gradient(ellipse 36px 42px at 72px 0,  transparent 30px, rgba(150,130,255,.055) 30px, rgba(150,130,255,.055) 34px, transparent 34px);
  background-size: 72px 42px;
  background-position: 0 0, 0 0, 0 0;
  opacity: 1;
  pointer-events: none;
}

/* ── Hero SVG scene (castle, torii, mountains, moon) ── */
.hero-scene {
  position: absolute; inset: 0; width: 100%; height: 100%;
  pointer-events: none;
}

/* ── Petals ── */
.petal {
  position: absolute; border-radius: 50% 0 50% 0;
  background: radial-gradient(circle, #ffb7c5 55%, transparent 100%);
  opacity: 0; animation: fall linear infinite; pointer-events: none; z-index: 3;
}
@keyframes fall {
  0%   { transform: translateY(-30px) rotate(0deg);    opacity: 0; }
  8%   { opacity: .8; }
  92%  { opacity: .3; }
  100% { transform: translateY(110vh) rotate(720deg);  opacity: 0; }
}

/* ── Japanese decorative kanji strip ── */
.hero-kanji {
  position: absolute; top: 0; right: 2rem;
  writing-mode: vertical-rl; font-size: .7rem;
  color: rgba(255,220,180,.18); letter-spacing: .4rem;
  font-weight: 300; pointer-events: none; z-index: 2;
  padding-top: 1.5rem;
}

/* ── Hero content ── */
.hero-content {
  position: relative; z-index: 4; padding: 1rem;
}

.hero-flag { font-size: 3.6rem; animation: pulse 2.5s ease-in-out infinite; display: block; margin-bottom: .5rem; }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }

.hero h1 {
  font-size: clamp(1.7rem, 5.5vw, 3.6rem); font-weight: 900; letter-spacing: 3px;
  background: linear-gradient(90deg, #ff8a80, #ffd740, #69f0ae, #80d8ff);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  text-shadow: none;
  margin-bottom: .3rem;
}

/* thin red line accent (rising-sun style) */
.hero-line {
  display: block; width: 60px; height: 2px;
  background: #cc2200; margin: .6rem auto;
  box-shadow: 0 0 8px #cc2200aa;
}

.hero-sub { font-size: .9rem; color: rgba(200,190,220,.65); letter-spacing: 4px; margin-bottom: 1rem; }

.hero-dates {
  display: inline-flex; gap: .9rem; flex-wrap: wrap; justify-content: center;
  background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
  border-radius: 50px; padding: .55rem 1.4rem; font-size: .88rem; color: var(--gold);
  backdrop-filter: blur(10px);
}

.countdown {
  margin-top: 1rem;
  display: inline-flex; align-items: center; gap: .6rem;
  background: rgba(200,40,40,.1); border: 1px solid rgba(200,40,40,.25);
  border-radius: 10px; padding: .5rem 1.2rem; backdrop-filter: blur(8px);
}
.countdown-label { font-size: .72rem; color: rgba(255,180,180,.6); letter-spacing: 1px; }
.countdown-value { font-size: 1rem; font-weight: 700; color: #ff8a80; }

[data-theme="light"] .hero { background: #f5e8d0; }
[data-theme="light"] .hero-bg { background: linear-gradient(175deg,#ede0cb,#f5e8d0,#ede0cb); }
[data-theme="light"] .hero-bg::after { opacity: .4; }
[data-theme="light"] .hero h1 { background: linear-gradient(90deg,#c0392b,#d35400,#27ae60,#2980b9); -webkit-background-clip:text; background-clip:text; }
[data-theme="light"] .hero-sub { color: rgba(80,40,20,.5); }
[data-theme="light"] .hero-dates { background:rgba(0,0,0,.06); border-color:rgba(0,0,0,.12); }
[data-theme="light"] .countdown { background:rgba(200,40,40,.06); }

.scroll-hint {
  position: absolute; bottom: 1.8rem; left: 50%; transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: .3rem;
  color: rgba(200,190,220,.4); font-size: .75rem; animation: bounce 2s infinite;
  cursor: pointer; z-index: 5;
}
@keyframes bounce { 0%,100%{transform:translateX(-50%) translateY(0)} 50%{transform:translateX(-50%) translateY(8px)} }

/* ── Hotel strip ─────────────────────────────────────────────────────── */
.hotel-strip {
  display: flex; gap: 1rem; padding: 1.1rem 2rem; flex-wrap: wrap; justify-content: center;
  background: var(--bg2); border-bottom: 1px solid var(--border);
}
.hotel-card {
  background: var(--bg3); border: 1px solid var(--border); border-radius: 12px;
  padding: .7rem 1.2rem; display: flex; align-items: center; gap: .75rem;
  transition: transform .2s, box-shadow .2s;
}
.hotel-card:hover { transform: translateY(-3px); box-shadow: var(--card-shadow); }
.hotel-icon { font-size: 1.4rem; }
.hotel-info .dates { font-size: .7rem; color: var(--gold); margin-bottom: .12rem; }
.hotel-info .name  { font-size: .86rem; font-weight: 600; }

/* ── Controls bar ────────────────────────────────────────────────────── */
.controls-bar {
  position: sticky; top: 0; z-index: 200;
  display: flex; align-items: center; gap: .55rem; padding: .55rem 1.4rem;
  background: var(--bg2); border-bottom: 1px solid var(--border);
  backdrop-filter: blur(14px); flex-wrap: wrap;
}
.ctrl-btn {
  background: var(--bg3); border: 1px solid var(--border); border-radius: 8px;
  padding: .34rem .8rem; font-size: .76rem; font-weight: 600; color: var(--text);
  cursor: pointer; transition: background .2s, transform .15s; white-space: nowrap;
}
.ctrl-btn:hover { background: rgba(255,255,255,.12); transform: translateY(-1px); }
[data-theme="light"] .ctrl-btn:hover { background: rgba(0,0,0,.08); }
.ctrl-btn.active { background: var(--gold); color: #1a1a2e; border-color: var(--gold); }
.ctrl-sep { width: 1px; height: 20px; background: var(--border); margin: 0 .15rem; }

/* ── Route Map ───────────────────────────────────────────────────────── */
.map-section { max-width: 900px; margin: 2.5rem auto 0; padding: 0 1.5rem; }
.map-wrap {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 18px;
  overflow: hidden;
}
.map-title { font-size: .8rem; font-weight: 700; letter-spacing: 2px; color: var(--text2);
  padding: .9rem 1.3rem .3rem; text-transform: uppercase; }
#route-svg { width: 100%; height: auto; display: block; }

/* ── Timeline ────────────────────────────────────────────────────────── */
.timeline-section { max-width: 900px; margin: 2rem auto; padding: 0 1.5rem 1rem; }
.section-title {
  text-align: center; font-size: 1.45rem; font-weight: 800; color: var(--gold);
  margin-bottom: 1.8rem; letter-spacing: 2px;
}
.day-card {
  position: relative; background: var(--bg2); border-radius: 18px; margin-bottom: 1rem;
  border: 1px solid var(--border); overflow: hidden; transition: box-shadow .3s;
}
.day-card:hover { box-shadow: var(--card-shadow); }
.day-card.done { opacity: .6; }
.day-card.done .day-title { text-decoration: line-through; }
.accent { position: absolute; left: 0; top: 0; bottom: 0; width: 5px; }
.day-header {
  display: flex; align-items: center; gap: .9rem; padding: 1rem 1.3rem;
  cursor: pointer; user-select: none;
}
.day-num {
  min-width: 48px; height: 48px; border-radius: 50%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-weight: 900; font-size: .66rem; line-height: 1.2; flex-shrink: 0;
}
.day-num span { font-size: 1.1rem; }
.day-meta { flex: 1; min-width: 0; }
.day-date  { font-size: .73rem; color: var(--text2); margin-bottom: .08rem; }
.day-title { font-size: .98rem; font-weight: 700; }
.day-tags  { display: flex; gap: .32rem; flex-wrap: wrap; margin-top: .3rem; }
.tag { font-size: .63rem; padding: .1rem .45rem; border-radius: 20px; font-weight: 700; letter-spacing: .4px; }
.tag-transport { background:rgba(77,150,255,.15); color:#7dc4ff; border:1px solid rgba(77,150,255,.25); }
.tag-food      { background:rgba(255,150,77,.15);  color:#ffba7d; border:1px solid rgba(255,150,77,.25); }
.tag-highlight { background:rgba(255,80,80,.15);   color:#ff9090; border:1px solid rgba(255,80,80,.25); }
.tag-nature    { background:rgba(77,200,130,.15);  color:#7dffc0; border:1px solid rgba(77,200,130,.25); }
.tag-culture   { background:rgba(200,150,255,.15); color:#d8b4ff; border:1px solid rgba(200,150,255,.25); }
.weather-badge {
  display: flex; flex-direction: column; align-items: center; min-width: 50px;
  text-align: center; flex-shrink: 0;
}
.weather-badge .w-icon { font-size: 1.35rem; line-height: 1; }
.weather-badge .w-temp { font-size: .65rem; color: var(--text2); margin-top: .12rem; white-space: nowrap; }
.chevron { font-size: 1rem; transition: transform .3s; color: var(--text2); margin-left: .4rem; flex-shrink: 0; }
.day-card.open .chevron { transform: rotate(180deg); }
.done-btn {
  width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--border);
  background: transparent; cursor: pointer; display: flex; align-items: center;
  justify-content: center; font-size: .82rem; transition: all .2s; flex-shrink: 0; color: var(--text2);
}
.done-btn:hover { border-color: var(--green); color: var(--green); }
.day-card.done .done-btn { background: var(--green); border-color: var(--green); color: #fff; }
.day-body { max-height: 0; overflow: hidden; transition: max-height .4s cubic-bezier(.4,0,.2,1); }
.day-card.open .day-body { max-height: 900px; }
.day-body-inner { padding: 0 1.3rem 1.3rem; display: grid; gap: .8rem; }
.info-block {
  background: var(--bg3); border-radius: 10px; padding: .8rem .95rem; border-left: 3px solid;
}
.info-block.itinerary { border-color: var(--blue); }
.info-block.transport { border-color: var(--gold); }
.info-block.food      { border-color: #ff6b6b; }
.info-block.highlight { border-color: #ff9f43; }
.info-block.costs     { border-color: var(--green); }
.info-label { font-size: .66rem; font-weight: 700; letter-spacing: 1px; color: var(--text2); margin-bottom: .38rem; text-transform: uppercase; }
.info-content { font-size: .88rem; line-height: 1.75; color: var(--text); }
.info-content a { color: var(--blue); text-decoration: none; border-bottom: 1px dashed currentColor; transition: opacity .2s; }
.info-content a:hover { opacity: .7; }
.cost-table { width: 100%; border-collapse: collapse; font-size: .8rem; }
.cost-table td { padding: .28rem .35rem; border-bottom: 1px solid var(--border); }
.cost-table td:last-child { text-align: right; font-weight: 600; }
.cost-table tr:last-child td { border-bottom: none; font-weight: 700; color: var(--green); font-size: .85rem; }
.cost-free { color: var(--text2); font-size: .72rem; }

/* ── Fixed sidebar ───────────────────────────────────────────────────── */
.sidebar-nav {
  position: fixed; right: .8rem; top: 50%; transform: translateY(-50%);
  display: flex; flex-direction: column; gap: .3rem; z-index: 300;
}
.sidebar-nav a {
  display: flex; align-items: center; justify-content: center;
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--bg2); border: 1px solid var(--border);
  color: var(--text2); text-decoration: none; font-size: .7rem; font-weight: 700;
  transition: all .2s;
}
.sidebar-nav a:hover, .sidebar-nav a.active {
  background: var(--gold); color: #1a1a2e; border-color: var(--gold); transform: scale(1.12);
}
@media (max-width: 768px) { .sidebar-nav { display: none; } }

/* ── FAB + progress ring ─────────────────────────────────────────────── */
.fab-wrap {
  position: fixed; bottom: 1.4rem; right: 1.4rem; z-index: 100;
  display: flex; flex-direction: column; align-items: center; gap: .35rem;
}
.fab {
  position: relative; width: 56px; height: 56px;
  cursor: pointer; background: none; border: none; padding: 0;
}
.fab-inner {
  position: absolute; inset: 6px;
  background: linear-gradient(135deg, #8b0000, #cc2200);
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 1.2rem; color: #fff; box-shadow: 0 4px 16px rgba(139,0,0,.55);
  transition: transform .2s;
}
.fab:hover .fab-inner { transform: scale(1.08); }
.fab svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.fab-ring-bg { fill: none; stroke: rgba(255,255,255,.1); stroke-width: 3; }
.fab-ring    { fill: none; stroke: var(--green); stroke-width: 3; stroke-linecap: round; transition: stroke-dashoffset .5s; }
.fab-count   { font-size: .6rem; color: var(--text2); text-align: center; }

/* ── Checklist ───────────────────────────────────────────────────────── */
.checklist-section { max-width: 900px; margin: 0 auto 4rem; padding: 0 1.5rem; }
.checklist-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: .65rem; }
.check-item {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 10px;
  padding: .62rem .88rem; display: flex; align-items: center; gap: .6rem;
  cursor: pointer; transition: background .2s;
}
.check-item:hover { background: rgba(255,255,255,.05); }
[data-theme="light"] .check-item:hover { background: rgba(0,0,0,.04); }
.check-item.checked { background: rgba(107,203,119,.08); border-color: rgba(107,203,119,.3); }
.check-item.checked .check-text { text-decoration: line-through; opacity: .45; }
.check-box {
  width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--border);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  transition: all .2s; font-size: .8rem;
}
.check-item.checked .check-box { background: var(--green); border-color: var(--green); color: #fff; }
.check-text { font-size: .83rem; }

/* ── Footer ──────────────────────────────────────────────────────────── */
footer { text-align: center; padding: 2rem; color: var(--text2); font-size: .76rem; }

/* ── Print ───────────────────────────────────────────────────────────── */
@media print {
  .controls-bar, .sidebar-nav, .fab-wrap, .scroll-hint,
  #progress-bar, .petal, .map-section, .hero-scene,
  .hero-bg, .hero-kanji { display: none !important; }
  body { background: #fff !important; color: #000 !important; }
  .hero { height: auto; min-height: auto; padding: 2rem 0; page-break-after: always;
    background: #fff !important; }
  .hero h1 { -webkit-text-fill-color: #000 !important; color: #000 !important; }
  .hero-dates { border: 1px solid #ccc !important; color: #333 !important; }
  .countdown { border: 1px solid #ccc !important; }
  .hotel-strip, .day-card, .info-block, .check-item {
    background: #fff !important; border: 1px solid #ddd !important;
    box-shadow: none !important; break-inside: avoid;
  }
  .day-body { max-height: none !important; }
  .day-card { page-break-inside: avoid; margin-bottom: 1rem; }
  .accent { display: none; }
  .tag { border: 1px solid #ccc; color: #333; background: #f5f5f5; }
  .info-content a { color: #0066cc; }
}
</style>
</head>
<body>

<div id="progress-bar"></div>

<!-- ══ HERO ══════════════════════════════════════════════════════════════ -->
<section class="hero" id="top">
  <div class="hero-bg"></div>

  <!-- Japanese scene SVG -->
  <svg class="hero-scene" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- seigaiha / 青海波 pattern -->
      <pattern id="seigaiha" x="0" y="0" width="60" height="52" patternUnits="userSpaceOnUse">
        <circle cx="30" cy="52" r="28" fill="none" stroke="rgba(180,160,255,0.07)" stroke-width="1.2"/>
        <circle cx="0"  cy="52" r="28" fill="none" stroke="rgba(180,160,255,0.07)" stroke-width="1.2"/>
        <circle cx="60" cy="52" r="28" fill="none" stroke="rgba(180,160,255,0.07)" stroke-width="1.2"/>
        <circle cx="30" cy="26" r="28" fill="none" stroke="rgba(180,160,255,0.05)" stroke-width="1"/>
      </pattern>
      <!-- radial glow for moon -->
      <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%"   stop-color="#cc4400" stop-opacity="0.18"/>
        <stop offset="60%"  stop-color="#990000" stop-opacity="0.08"/>
        <stop offset="100%" stop-color="#660000" stop-opacity="0"/>
      </radialGradient>
      <!-- castle gradient -->
      <linearGradient id="castleGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#1a0a2e"/>
        <stop offset="100%" stop-color="#06080f"/>
      </linearGradient>
      <!-- mountain gradient -->
      <linearGradient id="mtnBack" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#12103a" stop-opacity=".7"/>
        <stop offset="100%" stop-color="#080c20" stop-opacity=".9"/>
      </linearGradient>
      <linearGradient id="mtnFront" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#0c0a22" stop-opacity=".85"/>
        <stop offset="100%" stop-color="#060810" stop-opacity="1"/>
      </linearGradient>
    </defs>

    <!-- seigaiha pattern background -->
    <rect width="1000" height="600" fill="url(#seigaiha)"/>

    <!-- Rising moon / sun (right) -->
    <circle cx="820" cy="155" r="130" fill="url(#moonGlow)"/>
    <circle cx="820" cy="155" r="72"  fill="#8b1a00" opacity=".13"/>
    <circle cx="820" cy="155" r="60"  fill="#cc2200" opacity=".10"/>
    <circle cx="820" cy="155" r="48"  fill="#dd3300" opacity=".09"/>

    <!-- Horizontal decorative lines (Japanese style) -->
    <line x1="0" y1="290" x2="1000" y2="290" stroke="rgba(200,160,255,.04)" stroke-width="1"/>
    <line x1="0" y1="295" x2="1000" y2="295" stroke="rgba(200,160,255,.03)" stroke-width=".5"/>

    <!-- Back mountain range (Alps silhouette) -->
    <path d="M0 600 L0 350 L70 260 L130 310 L220 185 L310 265 L390 150 L460 230
             L530 105 L600 195 L660 140 L730 200 L790 120 L870 190 L950 130 L1000 170
             L1000 600 Z"
      fill="url(#mtnBack)"/>

    <!-- Snow caps on back mountains -->
    <path d="M530 105 L515 140 L545 140 Z M390 150 L373 185 L407 185 Z
             M660 140 L645 168 L675 168 Z M790 120 L775 152 L805 152 Z"
      fill="rgba(240,240,255,.18)"/>

    <!-- Mid mountain range -->
    <path d="M0 600 L0 420 L100 340 L180 390 L290 300 L380 360 L490 275
             L600 340 L700 285 L800 340 L900 295 L1000 330 L1000 600 Z"
      fill="url(#mtnFront)"/>

    <!-- ═══ TORII GATE (left side) ═══ -->
    <g transform="translate(108, 598)" opacity="0.22">
      <!-- Left pillar -->
      <rect x="0"   y="-260" width="16" height="270" fill="#9b1a00" rx="2"/>
      <!-- Right pillar -->
      <rect x="148" y="-260" width="16" height="270" fill="#9b1a00" rx="2"/>
      <!-- Kasagi (top curved beam) -->
      <path d="M-28 -258 C-28 -282 0 -290 82 -290 C164 -290 192 -282 192 -258
               L192 -244 C192 -244 164 -252 82 -252 C0 -252 -28 -244 -28 -244 Z"
        fill="#9b1a00"/>
      <!-- Upswept tips -->
      <path d="M-28 -258 C-42 -268 -44 -280 -36 -288" fill="none" stroke="#9b1a00" stroke-width="10" stroke-linecap="round"/>
      <path d="M192 -258 C206 -268 208 -280 200 -288" fill="none" stroke="#9b1a00" stroke-width="10" stroke-linecap="round"/>
      <!-- Shimagi (thin top crossbar) -->
      <rect x="-5"  y="-228" width="174" height="10" fill="#9b1a00" rx="2"/>
      <!-- Nuki (main crossbar) -->
      <rect x="-10" y="-195" width="184" height="16" fill="#9b1a00" rx="3"/>
    </g>

// WEATHER (forecast API – trip is in the future)
// ════════════════════════════════════════════════════════════════
const WMO = {
  0:['☀️','晴'], 1:['🌤️','大致晴'], 2:['⛅','多雲'], 3:['🌥️','陰'],
  45:['🌫️','霧'], 48:['🌫️','霧'], 51:['🌦️','毛雨'], 53:['🌦️','小雨'],
  55:['🌧️','細雨'], 61:['🌧️','小雨'], 63:['🌧️','中雨'], 65:['🌧️','大雨'],
  71:['🌨️','小雪'], 73:['🌨️','中雪'], 75:['❄️','大雪'],
  80:['🌦️','陣雨'], 81:['🌧️','陣雨'], 82:['⛈️','大陣雨'], 95:['⛈️','雷雨'],
};
const weatherData = {};

async function fetchWeather(lat, lon, start, end) {
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`
      + `&start_date=${start}&end_date=${end}`
      + `&daily=temperature_2m_max,temperature_2m_min,weathercode`
      + `&timezone=Asia%2FTokyo&forecast_days=16`;
    const j = await (await fetch(url)).json();
    (j.daily?.time || []).forEach((d, i) => {
      if (weatherData[d]) return;
      const code = j.daily.weathercode[i];
      const wmo  = WMO[code] || ['🌡️','—'];
      weatherData[d] = {
        icon: wmo[0], desc: wmo[1],
        tmax: Math.round(j.daily.temperature_2m_max[i]),
        tmin: Math.round(j.daily.temperature_2m_min[i]),
      };
    });
    updateWeatherBadges();
  } catch(e) { /* silent fail */ }
}

function updateWeatherBadges() {
  document.querySelectorAll('.weather-badge').forEach(el => {
    const w = weatherData[el.dataset.date];
    if (!w) return;
    el.querySelector('.w-icon').textContent = w.icon;
    el.querySelector('.w-temp').textContent = `${w.tmax}°/${w.tmin}°`;
    el.title = `${w.desc} · 高${w.tmax}° 低${w.tmin}°`;
  });
}

// ════════════════════════════════════════════════════════════════
function updateCountdown() {
  const now = new Date();
  const el  = document.getElementById('countdown-val');
  if (now < TRIP_START) {
    const diff = TRIP_START - now;
    const d = Math.floor(diff/864e5), h = Math.floor(diff%864e5/36e5),
          m = Math.floor(diff%36e5/6e4), s = Math.floor(diff%6e4/1e3);
    el.textContent = `${d} 天 ${h} 時 ${m} 分 ${s} 秒`;
    el.style.color = '#ff8a80';
  } else if (now <= TRIP_END) {
    el.textContent = `🎌 旅行第 ${Math.floor((now-TRIP_START)/864e5)+1} 天，玩得開心！`;
    el.style.color = 'var(--green)';
  } else {
    el.textContent = `旅行圓滿結束 · 已回台 ${Math.floor((now-TRIP_END)/864e5)} 天 🌸`;
    el.style.color = 'var(--text2)';
  }
}

// ════════════════════════════════════════════════════════════════
// ROUTE MAP ANIMATION
// ════════════════════════════════════════════════════════════════
const mapObs = new IntersectionObserver(entries => {
  if (!entries[0].isIntersecting) return;
  ['r1','r2','r3','r4','r5','r7'].forEach((id, i) => {
    const el = document.getElementById(id);
    if (!el) return;
    const len = el.getTotalLength ? el.getTotalLength() : 200;
    el.style.strokeDasharray = len;
    el.style.strokeDashoffset = len;
    setTimeout(() => {
      el.style.transition = `stroke-dashoffset 1.2s ease ${i * 0.28}s`;
      el.style.strokeDashoffset = '0';
    }, 500);
  });
  mapObs.disconnect();
}, { threshold: 0.3 });
mapObs.observe(document.getElementById('route-svg'));
